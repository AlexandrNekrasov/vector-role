---
role_name_check: 1

dependency:
  name: galaxy
  options:
    ignore-certs: false
    ignore-errors: false
    role-file: requirements.yml
    requirements-file: requirements.yml

platforms:
  - name: oraclelinux-9
    container_image: "geerlingguy/docker-rockylinux9-ansible:latest"
    container_command: "/usr/sbin/init"
  - name: ubuntu-latest
    container_image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    container_command: "/sbin/init"

ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
      remote_tmp: /tmp/.ansible/tmp
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
        - --force-handlers
  playbooks:
    create: create.yml
    converge: converge.yml
    destroy: destroy.yml
    cleanup: cleanup.yml
    prepare: prepare.yml
    side_effect: side_effect.yml
    verify: verify.yml

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
