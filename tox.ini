[tox]
skipsdist = True
envlist = molecule

[testenv]
basepython = python3
usedevelop = False
allowlist_externals = 
    dnf
commands_pre = 
    dnf install -y dnf-plugins-core
    dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
    dnf install -y docker-ce-cli
setenv =
    PYTHONUNBUFFERED=1
    ANSIBLE_FORCE_COLOR=1
    MOLECULE_NO_LOG=0
deps =
    molecule
    molecule-docker
    ansible
commands =
    molecule test -s default
